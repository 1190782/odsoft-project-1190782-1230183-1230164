
services:
    book1:
        image: 1190782/lmsbooks:latest
        #container_name: books1_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "8087:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance1,bootstrap,prod
        networks:
            - lms_network
        volumes:
            - "uploaded_files_volume_1:/tmp"
        deploy:
            replicas: 2
            privileged: true

    book2:
        image: 1190782/lmsbooks:latest
        #container_name: books2_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "8088:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance2,bootstrap,prod
        networks:
            - lms_network
        volumes:
            - "uploaded_files_volume_2:/tmp"
        deploy:
            replicas: 2
            privileged: true

networks:
    lms_network:
        external: true

volumes:
    uploaded_files_volume_1:
    uploaded_files_volume_2:
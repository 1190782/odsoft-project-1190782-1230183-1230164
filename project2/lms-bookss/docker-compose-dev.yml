
services:
    book1:
        image: 1190782/lmsbooks:latest
        container_name: books1_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "7001-7007:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance1,bootstrap,dev
        networks:
            - lms_network
        volumes:
            - "uploaded_files_volume_1:/tmp"
        deploy:
            replicas: 1
            privileged: true

    book2:
        image: 1190782/lmsbooks:latest
        container_name: books2_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "7007-7013:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance2,bootstrap,dev
        networks:
            - lms_network
        volumes:
            - "uploaded_files_volume_2:/tmp"
        deploy:
            replicas: 1
            privileged: true

networks:
    lms_network:
        external: true

volumes:
    uploaded_files_volume_1:
    uploaded_files_volume_2:
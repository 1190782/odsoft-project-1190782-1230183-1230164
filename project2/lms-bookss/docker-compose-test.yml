
services:
    lmsbooks_1:
        image: 1190782/lmsbooks:latest
        container_name: books1_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "7021-7027:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance1,bootstrap,test
        networks:
            - lms_network
        volumes:
            - "uploaded_files_volume_1:/tmp"
        deploy:
            replicas: 1
            privileged: true

    lmsbooks_2:
        image: 1190782/lmsbooks:latest
        container_name: books2_in_lms_network
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "7027-7033:8080"
        environment:
            SPRING_PROFILES_ACTIVE: instance2,bootstrap,test
        networks:
            - lms_network
        volumes:
            - "uploaded_files_volume_2:/tmp"
        deploy:
            replicas: 1
            privileged: true

networks:
    lms_network:
        external: true

volumes:
    uploaded_files_volume_1:
    uploaded_files_volume_2: